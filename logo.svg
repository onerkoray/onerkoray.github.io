<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Koray Öner">
  <style>
    .ko-ink { fill: #17201d; }
    .ko-pixels { fill: #0e7c66; }
    @keyframes koLeft { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-1.3px); } }
    @keyframes koRight { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(1.3px); } }
    @keyframes koPulse { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
    .ko-left { animation: koLeft 5.6s ease-in-out infinite; }
    .ko-right { animation: koRight 5.6s ease-in-out infinite; }
    .ko-pixels { animation: koPulse 5.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .ko-left, .ko-right, .ko-pixels { animation: none; }
      .ko-pixels { opacity: 1; }
    }
  </style>
  <rect x="1" y="1" width="62" height="62" rx="4" fill="#f5f7f6" stroke="#dfe5e1" stroke-width="1.5"/>
  <g class="ko-ink ko-left">
    <rect x="19.5" y="11.5" width="5" height="5" rx=".5"/>
    <rect x="14.5" y="17.5" width="5" height="5" rx=".5"/>
    <rect x="9.5" y="23.5" width="5" height="5" rx=".5"/>
    <rect x="4.5" y="29.5" width="5" height="5" rx=".5"/>
    <rect x="9.5" y="35.5" width="5" height="5" rx=".5"/>
    <rect x="14.5" y="41.5" width="5" height="5" rx=".5"/>
    <rect x="19.5" y="47.5" width="5" height="5" rx=".5"/>
  </g>
  <g class="ko-ink ko-right">
    <rect x="39.5" y="11.5" width="5" height="5" rx=".5"/>
    <rect x="44.5" y="17.5" width="5" height="5" rx=".5"/>
    <rect x="49.5" y="23.5" width="5" height="5" rx=".5"/>
    <rect x="54.5" y="29.5" width="5" height="5" rx=".5"/>
    <rect x="49.5" y="35.5" width="5" height="5" rx=".5"/>
    <rect x="44.5" y="41.5" width="5" height="5" rx=".5"/>
    <rect x="39.5" y="47.5" width="5" height="5" rx=".5"/>
  </g>
  <g class="ko-pixels">
    <rect x="34.5" y="14.5" width="5" height="5" rx=".6"/>
    <rect x="32.5" y="22.5" width="5" height="5" rx=".6"/>
    <rect x="30.5" y="30.5" width="5" height="5" rx=".6"/>
    <rect x="28.5" y="38.5" width="5" height="5" rx=".6"/>
    <rect x="26.5" y="46.5" width="5" height="5" rx=".6"/>
  </g>
</svg>
