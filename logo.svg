<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Koray Öner">
  <defs>
    <linearGradient id="lg-brkt" x1="10" y1="20" x2="54" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14b28e"/>
      <stop offset="1" stop-color="#0a5f4e"/>
    </linearGradient>
    <linearGradient id="lg-tile" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f2ec"/>
    </linearGradient>
  </defs>
  <style>
    /* Hareket: parantezler disari "nefes alir", egik cizgi kendi ORTASINDAN
       makas gibi yatar. Onceki surumde donme merkezi transform-box:fill-box
       ile 32px 32px verilmisti; fill-box koordinati kutunun KOSESINDEN sayar,
       yani merkez cizginin disina, (60,50) civarina dusuyordu. Sonuc donme
       degil savrulmaydi. center yazarak niyet edilen makas hareketi elde
       edildi; aci -4 yerine -5 cunku uc kaymasi (~1,55px) boylece parantez
       kaymasiyla (1,7px) ayni genlikte kaliyor. */
    @keyframes koBL { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-1.7px); } }
    @keyframes koBR { 0%,100% { transform: translateX(0); } 50% { transform: translateX(1.7px); } }
    @keyframes koSL { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-5deg); } }
    .ko-bl { animation: koBL 3.2s ease-in-out infinite; }
    .ko-br { animation: koBR 3.2s ease-in-out infinite; }
    .ko-sl { animation: koSL 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) { .ko-bl, .ko-br, .ko-sl { animation: none; } }
  </style>
  <rect x="1" y="1" width="62" height="62" rx="14.5" fill="url(#lg-tile)" stroke="#e3dfd6" stroke-width="1.2"/>
  <g fill="none" stroke="url(#lg-brkt)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path class="ko-bl" d="M21.8 21.5 L9.6 32 L21.8 42.5"/>
    <path class="ko-br" d="M42.2 21.5 L54.4 32 L42.2 42.5"/>
  </g>
  <line class="ko-sl" x1="38.6" y1="15.5" x2="25.4" y2="48.5" stroke="#232d29" stroke-width="3.2" stroke-linecap="round"/>
</svg>
