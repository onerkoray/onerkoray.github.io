<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Koray Öner">
  <!-- Düz işaret: aynı </> geometrisi, gradyan ve hareket yok. Önceki sürüm
       parantezleri gradyanla boyuyor ve üç parçayı sürekli "nefes" döngüsünde
       oynatıyordu; her sayfanın başlığında dönen bir süs, bilgi taşımıyordu.
       Köşe 14,5'ten 8'e indi: 30 pikselde ~4px, sitenin yüzey yarıçapı. -->
  <rect x="1" y="1" width="62" height="62" rx="8" fill="#ffffff" stroke="#dbe4df" stroke-width="1.5"/>
  <g fill="none" stroke="#0e7c66" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.8 21.5 L9.6 32 L21.8 42.5"/>
    <path d="M42.2 21.5 L54.4 32 L42.2 42.5"/>
  </g>
  <line x1="38.6" y1="15.5" x2="25.4" y2="48.5" stroke="#17201d" stroke-width="3.2" stroke-linecap="round"/>
</svg>
