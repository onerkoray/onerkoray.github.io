name: Günlük veri güncelleme

# TCMB bülteni her iş günü ~15.30'da (TRT) yayımlanır.
# 16:10 TRT = 13:10 UTC. Hafta içi çalışır; hafta sonu yeni bülten yok.
on:
  schedule:
    - cron: "10 13 * * 1-5"
  workflow_dispatch: {}      # elle de tetiklenebilir

permissions:
  contents: write

concurrency:
  group: veri-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kaynakları test et
        run: python tools/update_data.py --check

      - name: Sayfaları yeniden üret
        run: python tools/update_data.py

      # TÜFE serisi TCMB'nin Tüketici Fiyatları tablosundan. Betik yazmadan
      # önce açıklanmış dört SSK/Bağ-Kur artışını seriden yeniden hesaplar;
      # tutmazsa, kaynak geri gitmişse ya da geçmiş bir ay değişmişse dosyayı
      # YAZMAZ ve adım kırmızı olur. Emekli zammı sayfası seriden üretilir;
      # değiştiyse sitemap lastmod'u aynı commit'te bugüne çekilir (döviz
      # sayfasıyla aynı model). Etiket/damga adımlarından ÖNCE: dönem
      # ilerleyince <title> değişir, favicon ve damga ondan türer.
      - name: TÜFE serisi ve emekli zammı sayfası
        run: |
          python tools/tufe-guncelle.py
          node tools/emekli-zammi-sayfa.js --sitemap
          node tools/memur-zammi-sayfa.js --sitemap

      # Grafikler sayfası: ay sonu kur, politika faizi ve Dünya Bankası
      # enflasyonu. Betik yazmadan önce çapraz doğrular (Dünya Bankası'nın
      # Türkiye satırı TÜFE serisiyle, ay sonu kur günlük seriyle tutmalı);
      # tutmazsa dosya YAZILMAZ ve adım kırmızı olur. Sayfa seriden üretilir,
      # değiştiyse sitemap lastmod aynı commit'te bugüne çekilir.
      - name: Grafik verisi ve grafikler sayfası
        run: |
          python tools/grafik-verisi.py
          node tools/grafikler-sayfa.js --sitemap

      # update_data.py doviz sayfasini SABLONDAN bastan yaziyor; sablonda
      # og:image:alt, twitter:description ve kunye blogu yok. Bunlari
      # sonradan ekleyen uretecler burada calismazsa her veri
      # guncellemesinde siliniyorlar ve site dogrulamalari kiriliyor.
      # 2026-09-07'de tam olarak bu oldu.
      # SIRA ONEMLI: favikon.py sayfanin <title>'ini okuyup favicon'un
      # aria-label'ina koyuyor, doviz sayfasinin basligi da BULTEN TARIHINI
      # tasiyor. Yani kur her degistiginde favicon.svg de yeniden uretilmeli.
      # update_data.py'den SONRA, stil-damgasi'ndan ONCE calismali: damga
      # dosyanin iceriginden turuyor, once damgalanirsa damga bayat kalir.
      - name: Ortak etiket ve künyeleri tamamla
        run: |
          python tools/paylasim-meta.py
          python tools/metodoloji-blogu.py
          python tools/favikon.py
          python tools/stil-damgasi.py

      # Bot'un urettigi commit push edilmeden once kendi kurallarindan
      # gecsin: kirik bir sayfa main'e girmesin.
      - name: Hızlı erişim panelini tazele
        run: python tools/hizli-panel.py

      - name: Üretilen sayfaları denetle
        run: python tools/sayfa-denetimi.py --check

      - name: Değişiklik varsa commit et
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi
          git config user.name  "korayoner-bot"
          git config user.email "onerkoray@users.noreply.github.com"
          git add -A
          git commit -m "Günlük veri güncellemesi ($(date -u +%Y-%m-%d))"
          git push
