name: Siteyi yayınla

on:
  workflow_run:
    workflows: ["Site doğrulamaları", "Günlük veri güncelleme"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # IndexNow adımı son başarılı yayının commit'ini çalışma API'sinden okur.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # Günlük veri işi bot commit'i üretir; GITHUB_TOKEN push'u başka
      # workflow başlatmaz. workflow_run bu yayını da kapsar.
      # Daha yeni bir main commit'i varsa onun doğrulamasını bekle.
      - name: Yayın sırasını kontrol et
        id: sira
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$(git rev-parse HEAD)" = "$CHECKED_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$WORKFLOW" = "Günlük veri güncelleme" ] && [ "$(git rev-parse HEAD^)" = "$CHECKED_SHA" ] && [ "$(git log -1 --format=%an)" = "korayoner-bot" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.sira.outputs.publish == 'true'
        with:
          python-version: "3.12"

      - name: Yayın dosyalarını hazırla
        if: steps.sira.outputs.publish == 'true'
        run: |
          python tools/hizli-panel.py
          python tools/hizli-panel.py --check
          python tools/sayfa-denetimi.py --check
          mkdir "$RUNNER_TEMP/site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/site"
          cp index.html "$RUNNER_TEMP/site/index.html"
          rm -rf "$RUNNER_TEMP/site/.github"
          # Site içi arama dizini (Vercel derlemesindekiyle aynı betik).
          node scripts/build-search.mjs --output "$RUNNER_TEMP/site/pagefind"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        if: steps.sira.outputs.publish == 'true'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: steps.sira.outputs.publish == 'true'
        with:
          path: ${{ runner.temp }}/site

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        if: steps.sira.outputs.publish == 'true'
        id: deployment

      # IndexNow: güncellenen sayfaları Bing/Yandex'e bildir. Karşılaştırma,
      # son başarılı yayının commit'indeki content.json'a göre; yalnız dizine
      # açık ve "updated"i değişen ya da yeni adresler gider. Betik canlı
      # sitenin yeni tarihleri sunduğunu görmeden göndermez. Hata yayını
      # düşürmez.
      - name: IndexNow bildirimi
        if: steps.sira.outputs.publish == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Yayınlamadan biten (publish=false) çalışma da "success" görünür:
          # 7 Ekim 2026'da böyle bir çalışma temel alındı ve o günün
          # değişiklikleri hiç bildirilmedi. Temel, bu adımı GERÇEKTEN koşmuş
          # (atlanmamış) ve HEAD'in atası olan en yeni çalışmadır.
          ONCEKI=HEAD~1
          for RUN in $(gh api "repos/$REPO/actions/workflows/pages.yml/runs?status=success&branch=main&per_page=30" --jq '.workflow_runs[] | "\(.id):\(.head_sha)"' 2>/dev/null || true); do
            SHA=${RUN#*:}
            [ "$SHA" = "$(git rev-parse HEAD)" ] && continue
            git merge-base --is-ancestor "$SHA" HEAD 2>/dev/null || continue
            KOSTU=$(gh api "repos/$REPO/actions/runs/${RUN%%:*}/jobs" --jq '[.jobs[].steps[] | select(.name == "IndexNow bildirimi" and .conclusion == "success")] | length' 2>/dev/null || echo 0)
            if [ "$KOSTU" -gt 0 ]; then ONCEKI=$SHA; break; fi
          done
          # Bu adımı koşmuş çalışma yoksa (ilk kurulum) son 30 commit'in
          # başı temel alınır.
          if [ "$ONCEKI" = "HEAD~1" ] && [ "$(git rev-list --count HEAD)" -gt 30 ]; then ONCEKI=HEAD~30; fi
          node scripts/indexnow.mjs --onceki "$ONCEKI" --bekle 600
