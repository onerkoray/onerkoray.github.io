name: Site doğrulamaları

# Motorun doğruluğu sitenin en kırılgan iddiası: bir parametre yanlış girilirse
# hiçbir şey görünürde bozulmaz, sadece sonuçlar sessizce yanlış olur. Bu yüzden
# her değişiklikte resmî net asgari ücret referansı yeniden doğrulanır.
#
# yol (paths) filtresi KALDIRILDI. Buradaki yedi kontrolün dördü motorun değil
# SİTENİN tamamına bakıyor: sayfa denetimi 81 sayfayı, parametre kopyası bütün
# ağacı, CSS kontrolü stil dosyalarını, makale listesi ise makaleleri tarıyor.
# Filtre yalnızca bordro/ ve üç aracı kapsadığı için bu dördü çoğu push'ta hiç
# çalışmıyordu — muhafızlar duruyor ama nöbet tutmuyorlardı. İş tarayıcı
# gerektirmiyor ve saniyeler sürüyor; her push'ta çalışması doğru olanı.

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  dogrula:
    runs-on: ubuntu-latest
    # Bildirim adiminin issue acabilmesi icin. Varsayilan salt-okunur token
    # yeterli degil; actions:read da gerekiyor cunku DUSEN ADIMIN ADINI
    # calisma API'sinden okuyoruz.
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      # hizli-panel.py "son eklenenler" listesini sayfaların İLK COMMIT
      # tarihinden üretiyor. checkout varsayılan olarak sığ klon (depth 1)
      # yapar ve o geçmiş olmadan tarih okunamaz; fetch-depth: 0 şart.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Türetilmiş panel her commit'in tam geçmişinden üretilir. Yeni bir
      # sayfanın ilk commit'i, önceden elle ikinci commit gerektirmemeli.
      - name: Son eklenenler otomasyon testleri
        run: python tools/hizli-panel-test.py

      - name: Son eklenenleri üret
        run: python tools/hizli-panel.py

      # Alarmin kendisi de bir muhafiz. Bildirim sessizce bozulursa geriye
      # dogrulanmamis bir guvence kalir -- tam olarak duzeltmeye calistigimiz
      # hatanin sekli. Test, script'leri bu dosyadan OKUYOR; ayri bir kopya
      # tutmak, workflow degisince testin eskiyi dogrulamasi demekti.
      - name: CI bildirimi çalışıyor mu
        run: node tools/bildirim-test.js

      - name: Finans kuralları regresyonları
        run: node finans/test.js

      - name: Sonuç yüzeyi ve pilot araç regresyonları
        run: node tools/sonuc-yuzeyi-test.js

      # Faz 1 temel motorlari. Uzerlerine binecek her arac bunlara
      # bagli oldugu icin buradaki bir hata tek sayfayi degil butun
      # zinciri sessizce yanlisa cevirir.
      - name: Zaman ve nakit akışı motoru regresyonları
        run: node finans/zaman-test.js

      - name: Enflasyon motoru regresyonları
        run: node finans/enflasyon-test.js

      # Emeklilik motoru: ABO kademeleri yanlis girilirse sayfa calismaya
      # devam eder, yalnizca sonuclar sessizce yanlis olur. Kanundaki
      # kademeler bilinen referans degerlerle (9.000 gun -> %65 ve %50)
      # her push'ta yeniden dogrulaniyor.
      - name: Emeklilik motoru regresyonları
        run: node bordro/emeklilik-test.js

      # Kira geliri: istisna, beyan siniri ve iki gider yontemi ic ice
      # kurallar; biri kayarsa sonuc makul gorunup yanlis olur.
      - name: Kira geliri motoru regresyonları
        run: node bordro/gmsi-test.js

      # Borc simulasyonu: hatalari sessizdir. Faiz bir ay kayarsa ya da
      # kapanan borcun asgarisi serbest birakilmazsa sonuc makul gorunup
      # yanlis olur. Elle hesaplanmis vakalar + strateji degismezleri.
      - name: Borç kapatma motoru regresyonları
        run: node bordro/borc-test.js

      # Erken kapatma: iddiasi bir OZDESLIK. Tazminat yokken basabas
      # getiri, kredinin efektif yillik faizine esit olmali. Modelde
      # serbest kalan nakit bir ay kayarsa bu esitlik bozulur; test tam
      # olarak onu olcuyor (dort farkli kredi yapilandirmasinda).
      - name: Erken kapatma motoru regresyonları
        run: node finans/erken-kapatma-test.js

      # Ek odeme motoru YAYGIN BIR INANISI yanlisliyor ("ikramiyeni
      # Aralik'ta al, vergiden kac"). Boyle bir iddiada bulunan bir
      # sayfanin iddiasini her push'ta yeniden OLCMESI gerekir: uc
      # degismez (ayin gelir vergisini degistirmemesi, SGK tavani etkisi,
      # tek seferde almanin ustunlugu) testlerde sabitli.
      - name: Ek ödeme (prim/ikramiye) motoru regresyonları
        run: node bordro/ek-odeme-test.js

      # Nakit akisi: bir akis diyagraminin TEK iddiasi mutabakattir.
      # Giren ile cikan tutmuyorsa diyagram guzel gorunup yalan soyler ve
      # kimse fark etmez. Testler her dugumde mutabakati, omur bedelinin
      # REEL oldugunu ve tasarruf oraninin NET gelir uzerinden
      # hesaplandigini sabitliyor.
      - name: Nakit akışı motoru regresyonları
        run: node finans/nakit-akisi-test.js

      # Kisisel enflasyon bir ENDEKS uretiyor ve endekslerin hatalari
      # sessizdir: agirlik yanlis tarafa konursa sonuc makul gorunur,
      # yalnizca sistematik olarak yanlis olur. Ilk surumde harcama
      # paylariyla kurulan "enflasyon" cebirsel olarak toplam harcama
      # degisimine OZDESTI -- yani bir fiyat endeksi degildi. Testler
      # Laspeyres'i, katki ayristirmasinin toplamini ve fiyat/harcama
      # ayrimini sabitliyor.
      - name: Kişisel enflasyon motoru regresyonları
        run: node finans/kisisel-enflasyon-test.js

      # FINANSAL IKIZ OMURGASI.
      # profil.js VERI KATMANI: bozulursa tek bir sayfa degil, uzerine
      # binen her motor birden yanlisa doner -- ve bozulma sessizdir.
      # Ayrica kullanicinin en hassas verisi burada duruyor; saklama
      # kurallari (onaysiz YAZMAZ, onay kalkinca SILER) testle sabit.
      - name: Profil (veri katmanı) regresyonları
        run: node finans/profil-test.js

      # ikiz-motoru: 20 yillik bir projeksiyonun hatalari GORUNMEZ.
      # Grafik yine cizilir, sayilar yine makuldur, yalnizca yanlistir.
      # Testler once muhasebe ozdesliklerini (her yilda giren = cikan),
      # sonra modelin yazili varsayimlarini sabitliyor -- ilk yilin
      # gelirinin bordro motorunun yillik netine BIREBIR esit olmasi
      # dahil.
      - name: Finansal İkiz projeksiyon regresyonları
        run: node finans/ikiz-test.js

      # Hedef motoru kullaniciya "hedefine ulasiyorsun" diyor. Yanlis bir
      # "ulasiyorsun", plan yapan birini yillar sonra odeyemeyecegi bir
      # yukumlulugun onunde birakir -- ve hata sessizdir: cikti yine bir
      # yesil tik, yalnizca yanlis. Testler ayrica bir SUNUM kuralini
      # koruyor: "3 senaryodan 2'si" bir OLASILIK DEGILDIR ve motor
      # hicbir yerde yuzde uretmez.
      - name: Hedef motoru regresyonları
        run: node finans/hedef-test.js

      # Karar laboratuvari secenekleri SIRALIYOR; yanlis bir siralama
      # makul gorunen ama para kaybettiren bir tavsiye demek ve bu kod
      # tabaninda bir kez yasandi. Testlerin basinda bir OZDESLIK duruyor:
      # basabas getiri, kredinin efektif yillik faizine esit olmali --
      # birbirinden bagimsiz yazilmis iki motorun ayni sayiyi vermesi,
      # modelde paranin kaybolmadiginin kaniti. Uc farkli kredi oraninda
      # dogrulaniyor.
      - name: Karar laboratuvarı regresyonları
        run: node finans/karar-test.js

      # Kopru araclara kullanicinin EN HASSAS verisini tasiyor. Iki
      # kural sessizce bozulabilir ve ikisi de agir: onay yokken veri
      # okunursa "cihazinizdan cikmaz" iddiasinin dayandigi titizlik
      # coker; araclara YAZAN bir kopru ise "su hesabi bir deneyeyim"
      # diyen birinin gercek profilini bozar.
      - name: Profil köprüsü regresyonları
        run: node finans/profil-kopru-test.js

      # Kopru araclara HTML id'leriyle baglaniyor. Bir alan yeniden
      # adlandirildiginda hicbir sey patlamiyor: buton yine cikiyor,
      # kullanici yine tikliyor, yalnizca alanlarin bir kismi sessizce
      # bos kaliyor. Denetim id listesini ELLE TUTMUYOR, kopru kodundan
      # cikariyor -- elle tutulan bir liste korudugu kodla eskir.
      - name: Profil köprüsü alan denetimi
        run: node tools/kopru-denetimi.js

      # OLCUM ONAY KAPISI. Bu testin korudugu sey bir ozellik degil bir
      # SOZ: "hesap araclarina girdiginiz veriler cihazinizdan cikmaz".
      # Kapi sessizce bozulursa -- bir yukleme yolu erken tetiklenirse,
      # ret kaydedilmezse, geri alma sonrasi cerezler kalirsa -- kimse
      # fark etmez: sayfa acilir, araclar calisir, yalnizca soz
      # tutulmamistir.
      - name: Ölçüm onayı regresyonları
        run: node tools/onay-test.js

      # Emeklilik makalesi AKADEMIK bir iddia yayimliyor ve sayilarin
      # cogu elle yazilmis HTML tablolarinda duruyor. Bir rakam yanlis
      # girilirse sayfa acilmaya devam eder, tablo hizali gorunur, kimse
      # uyari almaz -- yalnizca yanlistir. Test anuite hesaplarini yeniden
      # yapiyor ve cubuk genisliklerini SAYFADAN okuyup olcek tutarliligini
      # dogruluyor.
      - name: Emeklilik makalesi sayı doğrulaması
        run: node tools/makale-emeklilik-test.js

      # MTV'de UC TARIFE var ve ucu de farkli davraniyor: (I) deger
      # kademeli (2018 sonrasi tescil), (I/A) kademesiz (2018 oncesi) ve
      # motosiklet. Arac uzun sure 2018 oncesi araclari (I)'in ilk
      # kademesiyle hesapliyordu; 1601 cm3 ve uzerinde bu ~%10 fazla vergi
      # demekti. Ayrica elektrikli araca cm3 soruluyordu -- kanun onlari
      # kW'a gore satira yerlestirir.
      #
      # Test, yayimlanan 2026 tutarlarini tebligden degil KANUNUN HAM
      # TUTARLARINDAN capraz dogruluyor: 145 hucrenin her biri icin
      # ham x K ile arasindaki fark yillik yuvarlama payi kadar olmali.
      - name: MTV tarife ve hesap kuralları
        run: node mtv-hesaplama/tarife-test.js

      # OTV'de hata yanlis oran yazmakla degil, aracin YANLIS SATIRA
      # dusmesiyle olur -- ve sonuc yine makul bir sayi gibi gorunur.
      # Kanunun hibrit satirlari KOSULLU (elektrik motoru 50 kW'i gecen,
      # sarjlida CO2 < 25 g/km ve menzil >= 70 km); eski form bu kosullari
      # etikette yaziyor ama hic sormuyordu. Test kosullari tam sinirlarinda
      # zorluyor: "gecen", "altinda" ve "ve uzerinde" kanunda farkli yazilmis
      # ve kodda da farkli olmak zorunda.
      - name: ÖTV tarife ve satır çözümü
        run: node otv-hesaplama/tarife-test.js

      # Yazi elle yazilmis onlarca tutar tasiyor ve hepsi OTV tarifesinden
      # turuyor. Tarife bir Cumhurbaskani Karariyla degistiginde arac
      # guncellenir, yazi ise sessizce eskir -- ve eskimis bir yazi bozuk
      # gorunmez, tablo yine hizali durur.
      #
      # Test yazidaki hicbir sayiyi kendi icinde tasimaz: hepsini tarife
      # modulunden yeniden hesaplar. Bos araliklar tablosu ayrica HTML'DEN
      # AYRISTIRILIR, cunku ayni tutar kisa cevapta da geciyor ve "sayfada
      # geciyor mu" kontrolu tablodaki bozuk hucreyi kaciriyordu.
      - name: ÖTV basamak yazısının sayıları
        run: node makaleler/otv-basamak-etkisi/sayi-testi.js

      # Fazla mesai yazisinin her tutari bordro/parametreler.js'teki zam
      # katsayilarindan turuyor. Katsayilar degisirse arac guncellenir,
      # yazi sessizce eskir. Test yazidaki hicbir sayiyi kendi icinde
      # tasimaz; iki tablosu da HTML'DEN AYRISTIRILIR, cunku ayni ifade
      # SSS'te de geciyor ve varlik kontrolu bozuk hucreyi kaciriyordu.
      - name: Fazla mesai yazısının sayıları
        run: node makaleler/fazla-mesai-zammi-yuzde-kac/sayi-testi.js

      # MTV yazisi 150'den fazla tutar tasiyor ve hepsi tarifeden turuyor.
      # Tarife her Ocak yeniden degerleme oraniyla degisiyor: arac
      # guncellenir, yazi sessizce eskir. Test yazidaki hicbir sayiyi kendi
      # icinde tasimaz; UC tarife tablosu da HTML'DEN AYRISTIRILIP hucre
      # hucre karsilastirilir.
      - name: MTV yazısının sayıları
        run: node makaleler/mtv-2026-ne-kadar/sayi-testi.js
      - name: Erken kapatma makalesi sayısal örneği
        run: node makaleler/krediyi-erken-kapatmak-mantikli-mi/sayi-testi.js
      - name: Peşin taksit karşılaştırması ve geçersiz girişler
        run: node pesin-mi-taksit-mi/test.js && node pesin-mi-taksit-mi/ui-test.js

      # Dilim kaymasi yazisi YEDI YILLIK parametreden turuyor. Gecmis bir yil
      # duzeltilir ya da 2027 eklenirse yazi sessizce eskir: tablolar hizali
      # durur, oranlar makul okunur, yalnizca yanlistir. Test ayrica istisna
      # REJIM DEGISIMINI iki yonlu sabitliyor (2022 oncesi AGI, sonrasi
      # asgari ucret istisnasi) -- ilk yazimda bu ayrim atlanmisti.
      - name: Vergi dilimi kayması yazısının sayıları
        run: node makaleler/vergi-dilimleri-asgari-ucrete-yetisemiyor/sayi-testi.js

      # Serbest meslek makbuzu yazisi UCRET DISI tarifeden turuyor -- o
      # tarife ucret tarifesinden farkli (ucuncu dilim 1.000.000, ucrette
      # 1.500.000) ve her Ocak degisiyor. Test ayrica yazinin OZDESLIGINI
      # sabitliyor: stopaj ve KDV oranlari esitken hesaba gecen tutar brut
      # ucrete esit cikar. Oranlardan biri degisirse ozdeslik bozulur.
      - name: Serbest meslek makbuzu yazısının sayıları
        run: node makaleler/serbest-meslek-makbuzu-stopaj-kdv/sayi-testi.js

      # Dilim kaymasi yazisi bes tablo ve IKI BICIMSEL ONERME tasiyor.
      # En kritik kontrol, "ilk dilim esigini degistirmek asgari ucret ustu
      # hicbir ucretlinin vergisini degistirmez" iddiasinin SAYISAL
      # sinamasi: esik motorda fiilen degistirilip farkin sifir oldugu
      # olculuyor. Ayrica kontrol olarak ikinci esikte ayni islem yapilip
      # etkinin sifir OLMADIGI dogrulanıyor -- yoksa motor esikleri hic
      # okumasa da test gecerdi.
      # Beyan siniri yazisinin TABLOLARI uretiliyor; once uretecin ciktisi
      # guncel mi diye bakiliyor, sonra sayilar dogrulaniyor. Ikisi ayri
      # adim, cunku "tablo bayat" ile "sayi yanlis" bambaska iki ariza.
      # Kart yazisinin oranlari TCMB'den geliyor ve AYLIK degisebiliyor;
      # BDDK'nin asgari odeme kurali da Kurul karariyla degisir. Tablolar
      # bu ikisinden turedigi icin once uretecin ciktisi, sonra sayilar
      # denetleniyor.
      # Ikramiye yazisinin tablolari SGK tavanindan ve tarifeden turuyor;
      # 2027 girildiginde ikisi de degisir. Ayrica asgari ucret yil ortasinda
      # zamlanirsa tavan da degisir ve "ay secimi notr" onermesi o yil icin
      # kirilir -- test bunu iki yonlu olcuyor.
      # Sitenin en cok okunan iki yazisi hareketli bir yasama durumunu
      # anlatiyor ve bugune kadar hic testi yoktu. Bu adim tarihe bagli
      # ifadeleri, iki yazinin birbiriyle celismedigini ve takvim
      # satirlarinin yaslanmasini denetliyor. 1 Ekim'de kirmiziya donmesi
      # BEKLENEN davranis: duzeltilecek cumleleri adiyla soyluyor.
      - name: Mevzuat takvimi yazılarının iddiaları
        run: node tools/mevzuat-testi.js

      # YDO yazisinin tablolari hem tarifeden hem oran serisinden turuyor.
      # 2027 tarifesi girildiginde kural denetimi yeni yili kendiliginden
      # kapsar; oran serisine 2027 satiri eklenmemisse test bunu soyler.
      # Tavan tablolari hem parametrelerden hem emeklilik motorundan
      # turuyor. Katsayi bir daha degisirse karsi olgu sutunu kendiliginden
      # yeni katsayiyi kullanir; tablo bayatlarsa --check soyler.
      # Vergi kamasi yazisinin DOI'si var: sayilari alintilanabilir.
      # Test YILA CIVILI (2026) -- sayfa, atif verilen surumden ayrismasin
      # diye tablolar ureteci degil testle korunuyor. 2026 parametreleri
      # degisirse kirmizi doner ve bu dogru davranistir.
      - name: Vergi kaması yazısının sayıları
        run: node makaleler/vergi-kamasi-ucretin-gercek-yuku/sayi-testi.js

      - name: Tavan tablolarının güncelliği
        run: node tools/tavan-tablosu.js --check

      - name: SGK tavanı yazısının sayıları
        run: node makaleler/sgk-prim-tavani-9-kat/sayi-testi.js

      - name: Yeniden değerleme tablolarının güncelliği
        run: node tools/ydo-tablosu.js --check

      - name: Yeniden değerleme yazısının sayıları
        run: node makaleler/yeniden-degerleme-orani-nedir/sayi-testi.js

      - name: İkramiye tablolarının güncelliği
        run: node tools/ikramiye-tablosu.js --check

      - name: İkramiye zamanlaması yazısının sayıları
        run: node makaleler/ikramiye-hangi-ay-odenmeli/sayi-testi.js

      - name: Kart tablolarının güncelliği
        run: node tools/kart-tablosu.js --check

      - name: Kredi kartı asgari ödeme yazısının sayıları
        run: node makaleler/kredi-karti-asgari-odeme/sayi-testi.js

      - name: Beyan sınırı tablolarının güncelliği
        run: node tools/beyan-tablosu.js --check

      # Bu yazinin sinirlari dogrudan tarifenin dilim tutarlari. 2027
      # tarifesi girildiginde 400.000 ve 5.300.000 eskir ve yaziyi
      # yukumluluk doguran bir esik konusunda yanlis hale getirir.
      - name: İki işten maaş yazısının sayıları
        run: node makaleler/iki-isten-maas-beyanname-siniri/sayi-testi.js

      - name: Dilim kayması yazısının sayıları
        run: node makaleler/dilim-kaymasi-2022-2026/sayi-testi.js

      # Gorsel tarafindaki bozulmalar SESSIZDIR: sayfa acilir, grafik
      # gorunur, yalniz Google onu bulamaz. 2026-09-14 denetimi 21
      # makalenin 12'sinin govdesinde HIC <img> olmadigini buldu -- veri
      # gorselleri CSS ile ciziliyordu ve gorsel aramaya gorunmezdi.
      - name: Makale veri görselleri yerinde mi
        run: python tools/makale-gorseli.py --check

      - name: Görsel SEO regresyonları
        run: node tools/gorsel-seo-test.js

      # Atif etiketleri DOI'li makalelerin kendi semasindan turuyor.
      # Semada baslik/tarih/DOI degisirse etiket bayatlar; --check bunu
      # yakalar. Ayri bicim testi etiketin KENDI kurallarina bakiyor --
      # ozellikle DOI'siz sayfada etiket BULUNMAMASINA.
      - name: Atıf etiketlerinin güncelliği
        run: python tools/atif-etiketleri.py --check

      - name: Atıf etiketlerinin biçimi
        run: node tools/atif-test.js

      # TARIHE BAGLI IDDIALAR.
      # Sitenin en cok tiklanan sayfasi bir TARIHE dayaniyor: "5 Eylul 2026
      # itibariyla sunulmus teklif yok; TBMM 1 Ekim'de aciliyor". 1 Ekim
      # geldiginde bu cumle sessizce yanlis olacak -- sayfa acilir, hicbir
      # test patlamaz -- ve tam o gun sorgu hacmi zirveye cikiyor. Yani
      # yazinin en yanlis oldugu an, en cok okundugu an.
      #
      # Yazi bunu zaten yazili olarak taahhut ediyordu. Arkasinda mekanizma
      # olmayan bir taahhut niyettir; unutulur. Bu kontrol onu takvime baglar.
      - name: Tarihe bağlı iddiaların süresi doldu mu
        run: node tools/gecerlilik.js --check

      # Muhafizin kendisi de bir muhafiz ister: bildirimin bicimi bozulursa
      # kontrol sayfayi hic gormez ve CI yemyesil kalir. Kurulmus gorunup
      # hicbir sey tutmayan bir kapi, hic olmamasindan kotudur.
      - name: Geçerlilik kapısı gerçekten kapanıyor mu
        run: node tools/gecerlilik-test.js

      # Bir PAROLA URETECINDE hatalar sessizdir: zayif rastgelelik,
      # yanli modulo, eksik sinif ya da sisirilmis entropi ekranda
      # gorunmez -- cikti yine rastgele bir dizi gibi durur ve kullanici
      # yanlis bir guvenlik duygusu tasir. Testler ozdeslikleri
      # (entropi duzeltmesi = log2(kabul olasiligi)), dagilimi ve
      # 'Password123! artik guclu sayilmaz' kuralini sabitliyor.
      - name: Yatırım fizibilitesi regresyonları
        run: node yatirim-fizibilite-hesaplama/test.js

      - name: Şifre motoru regresyonları
        run: node keymint/sifre-test.js

      # Dagitim motoru bir ONERI uretiyor: yanlis oncelik sirasi, makul
      # gorunen ama para kaybettiren bir tavsiye demek. Oncelik kurallari
      # ve reel getiri aritmetigi burada sabitleniyor.
      - name: Dağıtım motoru regresyonları
        run: node finans/dagitim-test.js

      - name: Motor testleri
        run: node bordro/test.js

      - name: Kredi çekirdeği testleri
        # YMO ikiye bölmesinin yönü ters kurulduğunda oran sessizce 0
        # dönüyordu: sayfa açılıyor, hiçbir yerde hata yok, yalnızca rakam yanlış.
        run: node kredi-hesaplama/test.js

      - name: Ev/kira karşılaştırma testleri
        run: node ev-almak-mi-kiralamak-mi/test.js

      - name: Finansal emniyet çekirdeği testleri
        run: node finansal-emniyet-testi/test.js

      - name: FIRE simülasyon testleri
        run: node finansal-ozgurluk-hesaplama/test.js

      - name: Vergi kaması testleri
        # Marjinal oran hem motordan ölçülüyor hem mevzuattan türetiliyor;
        # ikisi ayrışırsa hata sayfada değil burada görünmeli.
        run: node vergi-kamasi-hesaplama/test.js

      - name: Ücret–kâr payı optimizasyonu testleri
        # Bir varsayılan değerin çekirdektekinin tersine kurulması yıllık
        # nette 14.467 TL sapma üretmişti; onu yakalayan test burada.
        run: node ucret-kar-payi-optimizasyonu/test.js

      - name: Zam çekirdeği testleri
        run: node zam-hesaplama/test.js

      - name: Birikim çekirdeği testleri
        run: node birikim-hesaplama/test.js

      - name: Fatura çekirdeği testleri
        # Fatura tutarı sessizce yanlış olabilen bir sayıdır: kuruş dağıtımında
        # bir hata olsa belge yine oluşur, yalnızca toplam tutmaz.
        run: node fatura-olusturma/test.js

      - name: Çıkış paketi testleri
        run: node bordro/cikis-test.js

      # Cikis takvimi bir KARAR araci: kullaniciya "su tarihte ayrilmak su
      # kadar fark ettirir" diyor. Olcut yanlis kurulursa cikti yine makul
      # gorunur, yalnizca yanlis tarihi isaret eder. Testin ilk bolumu tam
      # olarak olcutu sabitliyor: naif olcutun her ay basinda urettigi sahte
      # esigin duzeltilmis olcutte CIKMADIGINI dogruluyor.
      - name: Çıkış takvimi tarama testleri
        run: node cikis-takvimi/test.js

      - name: Çalışma biçimi testleri
        run: node bordro/calisma-bicimi-test.js

      - name: Fatura arşiv (çalışma alanı) testleri
        # Bir arşivin sessizce bozulması, yanlış tutardan daha kötüdür:
        # yanlış tutar görülür, kaybolan belge görülmez.
        run: node fatura-olusturma/arsiv-test.js

      - name: Makale listeleri güncel mi
        run: python tools/makale-listesi.py --check

      - name: Besleme (atom.xml) güncel mi
        # Besleme elle bakılıyordu ve sessizce bayatladı: üç yeni araç eksikti.
        # robots.txt'te Sitemap olarak duyurulduğu için eksik girdi, yeni sayfanın
        # bir keşif yolunu kaybetmesi demek.
        run: python tools/besleme.py --check

      - name: Çekirdek deposu tutarlı mı
        # Site 80'den fazla sayfada "hesap yöntemi ve testler herkese açık"
        # diyor. Bu kontrol, o iddianın hedefi olan dosyaların yerinde durduğunu
        # ve sayfaların doğru depoya bağlandığını doğrular.
        run: python tools/cekirdek.py --check

      - name: Hızlı erişim paneli güncel mi
        run: python tools/hizli-panel.py --check

      - name: Sayfa kalitesi denetimi
        run: python tools/sayfa-denetimi.py --check

      - name: Paylaşım meta etiketleri tam mı
        # og:image:alt 37, twitter:description 32 sayfada eksikti. İkisi de
        # sessiz eksik: sayfa açılır, kart görünür, kimse hata görmez.
        run: python tools/paylasim-meta.py --check

      - name: CSS parantez dengesi
        run: node tools/css-kontrol.js --check

      - name: Parametre kopyası var mı
        run: node tools/parametre-kopyasi.js --check

      - name: Parametre tablosu güncel mi
        run: node tools/bordro-tablo.js --check

      - name: Araç künyeleri güncel mi
        run: python tools/metodoloji-blogu.py --check

      - name: Maaş sayfaları güncel mi
        # Bu 28 sayfa bir zamanlar birbirinin rakam değiştirilmiş kopyasıydı;
        # kelime örtüşmeleri 0,813 idi. Seçili 8'i motordan üretilen ve elle
        # yazılmış bölümler alıyor, kalan 20'si noindex. Bu kontrol hem blokların
        # motorla uyumunu hem de noindex ile sitemap'in çelişmemesini doğrular.
        run: node tools/maas-sayfalari.js --check

      - name: Diyagramlar güncel mi
        # Şema içeriği motordan ve depodan üretiliyor; elle çizilmiş bir şema
        # eskirken sessiz kalır, üretilen şema burada patlar.
        run: node tools/diyagram.js --check

      - name: Kart karoları ikon kaynağıyla aynı mı
        run: python tools/kart-karo.py --check

      - name: Araç başlık simgeleri güncel mi
        run: python tools/arac-simgesi.py --check

      - name: Faviconlar ikon kaynağıyla aynı mı
        run: python tools/favikon.py --check

      # Favicon SESSIZ bozulur: sayfa acilir, arac calisir, yalnizca
      # sekmede yanlis simge durur. Test renklerin style.css'ten
      # kopmadigini, her sayfanin bagli oldugu dosyanin GERCEKTEN var
      # oldugunu ve eski yesil gradyanin geri gelmedigini sabitliyor.
      - name: Favicon sistemi regresyonları
        run: node tools/favikon-test.js

      - name: Stil damgaları güncel mi
        run: python tools/stil-damgasi.py --check

      # Vurgu rengi kullanici tercihi (bes palet). Bir grafik serisi
      # var(--brand) kullanirsa verinin ANLAMI temayla degisiyor —
      # olculdu: emniyet testinde yesil temada CVD DeltaE 5,0.
      - name: Veri görselleştirme renkleri kurallara uygun mu
        run: node tools/veri-renkleri.js --check

      # Kart tarihleri git gecmisinden uretiliyor; checkout zaten
      # fetch-depth: 0 ile tam gecmisi cekiyor (hizli-panel icin).
      - name: Araç kartlarındaki güncelleme tarihleri güncel mi
        run: python tools/arac-guncelleme.py --check

      # Gecmis yillarin issizlik odenegi tablosu bordro/parametreler.js'ten
      # turetiliyor. Elle yazilsaydi asgari ucret her degistiginde sessizce
      # eskirdi: sayfa acilir, tablo hizali gorunur, yalnizca yanlistir.
      - name: İşsizlik ödeneği tablosu güncel mi
        run: node tools/issizlik-tablosu.js --check

      # Kidem tavani tablosu da ayni sekilde parametrelerden turuyor.
      # Elle yazilsaydi her yeni genelgede sessizce eskirdi: sayfa acilir,
      # tablo hizali gorunur, yalnizca yanlistir. Tavan yilda IKI KEZ
      # degisiyor, yani eskime firsati yilda iki kez geliyor.
      - name: Kıdem tavanı tablosu güncel mi
        run: node tools/kidem-tavan-tablosu.js --check

      # lastmod bir IDDIADIR: "bu sayfanin icerigi bu tarihte degisti".
      # Sisirilmis lastmod tazelik sinyalini guclendirmez, SUSTURUR --
      # arama motoru bos yere gelir ve zamanla o alana guvenmemeyi
      # ogrenir. Denetim, tarihleri arac kartlariyla AYNI olcute gore
      # dogruluyor: tarama commit'leri ve yalnizca damga degisen
      # commit'ler sayilmiyor.
      - name: Sitemap lastmod tarihleri güncel mi
        run: python tools/site-haritasi.py --check

      # Ana sayfadaki "N arac" cumlesi elle yazilmisti ve eskimisti:
      # sayfada 43 kart dururken iki yerde birden "34 arac" yaziyordu.
      - name: Ana sayfadaki araç sayısı doğru mu
        run: python tools/arac-sayisi.py --check

      # Hakkimda sayfasi artik "bir iddia denetlenebilir olmali" diyor;
      # kendi sayilarini elle tasimasi tam da o cumleyi curuturdu. Blok
      # depodan uretiliyor ve bayatladiginda burasi kiriliyor.
      - name: Hakkımda sayfasının sayıları güncel mi
        run: python tools/hakkimda-rakamlar.py --check

      - name: Marka ikonları favicon.svg ile uyumlu mu
        run: |
          pip install --quiet pillow
          python tools/ikon.py --check

      - name: Paylaşım kartı paletleri kontrastı geçiyor mu
        # Kart renkleri elle seçilirse sessizce AA altına düşüyor (eski tek
        # şablonun yeşili beyaz metinde 3.28:1 idi). Tarayıcı gerektirmez.
        run: python tools/make-og.py --kontrast

      # ----------------------------------------------------------------
      # BILDIRIM
      #
      # Bu depodaki muhafizlarin TAMAMI burada duruyor. Basarisizlik haber
      # vermiyorsa "testler var" guvencesi gercekte yok: bozulan bir muhafiz
      # haftalarca bozuk kalabilir ve o sure boyunca sessizce yanlis sonuc
      # ureten bir degisiklik gecebilir.
      #
      # Bu bos bir korku degil, olcum: workflow 2026-09-12 12:28'den
      # 2026-09-13 09:30'a kadar DOKUZ push boyunca kirmizi kaldi ve kimse
      # gormedi. Ancak elle API'ye bakinca ortaya cikti.
      #
      # TASARIM: her basarisizlikta YENI issue acilmiyor. Tek bir takip
      # issue'su aciliyor, sonraki dususlar oraya yorum dusuyor ve yesile
      # donunce issue KAPANIYOR. Kendini temizlemeyen bir bildirim kisa
      # surede gurultuye donusur; gurultu de okunmaz, yani bildirim yokmus
      # gibi olur. Acik issue sayisi bu yuzden en fazla bir.
      # ----------------------------------------------------------------
      - name: Başarısızlığı bildir
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const etiket = "ci-kirmizi";
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Issue'nun ise yaramasi icin HANGI ADIMIN dustugunu yazmasi
            // sart; yalnizca "bir sey bozuldu" demek, elle bakmaktan
            // kurtarmiyor.
            //
            // YARIS DURUMU: bu adim KENDI calismasini sorguluyor ve dusen
            // adimin sonucu API'ye heniz islenmemis olabiliyor. Ilk gercek
            // atesleme (issue #1) tam bunu yasadi: sorgu basarili dondu ama
            // hicbir adim "failure" gorunmuyordu. Bos donduyse kisa araliklarla
            // yeniden deneniyor.
            //
            // ISTISNA ise YENIDEN DENENMIYOR: o bir izin sorunudur (actions:read),
            // beklemek duzeltmez. Iki durum mesajda da AYRI yaziliyor; ikisini
            // "okunamadi" diye birlestirmek, hangi sorunu aradigini gizliyordu.
            let dusen = [];
            let sorguHatasi = "";
            for (let deneme = 0; deneme < 3; deneme++) {
              try {
                const { data: isler } = await github.rest.actions.listJobsForWorkflowRun({
                  owner, repo, run_id: context.runId, per_page: 100
                });
                dusen = [];
                for (const is of isler.jobs) {
                  for (const adim of is.steps || []) {
                    if (adim.conclusion === "failure") dusen.push(adim.name);
                  }
                }
              } catch (e) {
                sorguHatasi = e.message;
                core.warning("Düşen adım sorgusu başarısız: " + e.message);
                break;
              }
              if (dusen.length) break;
              if (deneme < 2) await new Promise(function (c) { setTimeout(c, 2000); });
            }

            const adimSatiri = dusen.length
              ? dusen.join(", ")
              : (sorguHatasi
                  ? "sorgulanamadı (" + sorguHatasi + ")"
                  : "API'ye henüz işlenmemiş — çalışma bağlantısından bakın");

            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const govde = [
              `**Düşen adım:** ${adimSatiri}`,
              `**Commit:** ${context.sha.slice(0, 7)} — ${context.payload.head_commit?.message?.split("\n")[0] || ""}`,
              `**Çalışma:** ${url}`,
              "",
              "Yeşile dönen ilk push'ta bu issue otomatik kapanır."
            ].join("\n");

            let acik = [];
            try {
              const r = await github.rest.issues.listForRepo({
                owner, repo, state: "open", labels: etiket
              });
              acik = r.data;
            } catch (e) {
              core.warning("Açık issue aranamadı: " + e.message);
            }

            if (acik.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: acik[0].number, body: govde
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: "CI kırmızı: site doğrulamaları düşüyor",
                body: govde,
                labels: [etiket]
              });
            }

      - name: Yeşile dönünce takip issue'sunu kapat
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const etiket = "ci-kirmizi";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let acik = [];
            try {
              const r = await github.rest.issues.listForRepo({
                owner, repo, state: "open", labels: etiket
              });
              acik = r.data;
            } catch (e) {
              return;   // etiket hic olusmamissa yapacak is yok
            }
            for (const issue of acik) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Yeşile döndü: ${context.sha.slice(0, 7)}.`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: "closed"
              });
            }
