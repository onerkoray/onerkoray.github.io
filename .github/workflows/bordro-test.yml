name: Bordro motoru testleri

# Motorun doğruluğu sitenin en kırılgan iddiası: bir parametre yanlış girilirse
# hiçbir şey görünürde bozulmaz, sadece sonuçlar sessizce yanlış olur.
# Bu yüzden her değişiklikte resmî net asgari ücret referansı yeniden doğrulanır.

on:
  push:
    paths:
      - "bordro/**"
      - "tools/bordro-tablo.js"
      - "tools/metodoloji-blogu.py"
      - "tools/make-og.py"
      - ".github/workflows/bordro-test.yml"
  pull_request:
  workflow_dispatch: {}

jobs:
  dogrula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Motor testleri
        run: node bordro/test.js

      - name: Çıkış paketi testleri
        run: node bordro/cikis-test.js

      - name: Çalışma biçimi testleri
        run: node bordro/calisma-bicimi-test.js

      - name: Makale listeleri güncel mi
        run: python tools/makale-listesi.py --check

      - name: Sayfa kalitesi denetimi
        run: python tools/sayfa-denetimi.py --check

      - name: CSS parantez dengesi
        run: node tools/css-kontrol.js --check

      - name: Parametre kopyası var mı
        run: node tools/parametre-kopyasi.js --check

      - name: Parametre tablosu güncel mi
        run: node tools/bordro-tablo.js --check

      - name: Araç künyeleri güncel mi
        run: python tools/metodoloji-blogu.py --check

      - name: Paylaşım kartı paletleri kontrastı geçiyor mu
        # Kart renkleri elle seçilirse sessizce AA altına düşüyor (eski tek
        # şablonun yeşili beyaz metinde 3.28:1 idi). Tarayıcı gerektirmez.
        run: python tools/make-og.py --kontrast
