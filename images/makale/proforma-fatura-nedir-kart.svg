<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Yazinin ele aldigi baslikların guncel durumu"><style>text{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif}</style><rect width="800" height="500" fill="#f7f5f0"/><rect width="8" height="500" fill="#0e7c66"/><svg x="34" y="30" width="732" height="440" viewBox="0 0 600 360"><circle cx="46" cy="90" r="17" fill="#eb6834" fill-opacity="0.14"/><text x="46" y="97" text-anchor="middle" font-size="19" font-weight="700" fill="#eb6834">✕</text><text x="78" y="86" font-size="18" font-weight="700" fill="#17201d">Muhasebe kaydı doğurur mu?</text><text x="78" y="109" font-size="14" fill="#56605c">Hayır — deftere yazılmaz</text><circle cx="46" cy="176" r="17" fill="#eb6834" fill-opacity="0.14"/><text x="46" y="183" text-anchor="middle" font-size="19" font-weight="700" fill="#eb6834">✕</text><text x="78" y="172" font-size="18" font-weight="700" fill="#17201d">KDV doğurur mu?</text><text x="78" y="195" font-size="14" fill="#56605c">Hayır — beyannameye girmez</text><circle cx="46" cy="262" r="17" fill="#1baf7a" fill-opacity="0.14"/><text x="46" y="269" text-anchor="middle" font-size="19" font-weight="700" fill="#1baf7a">✓</text><text x="78" y="258" font-size="18" font-weight="700" fill="#17201d">Sözleşme kurabilir mi?</text><text x="78" y="281" font-size="14" fill="#56605c">Evet — kabul edilirse bağlar</text></svg></svg>
