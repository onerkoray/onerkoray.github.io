<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Anahtar teslim fiyat ekseni üzerinde ÖTV eşiklerinin doğurduğu boş aralıklar; en genişi 594.000 lira"><style>text{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif}</style><rect width="800" height="500" fill="#f7f5f0"/><rect width="8" height="500" fill="#0e7c66"/><svg x="34" y="30" width="732" height="440" viewBox="0 0 600 360"><text x="34" y="38" font-size="18" font-weight="700" fill="#17201d">Anahtar teslim fiyatta boş kalan aralıklar</text><text x="34" y="60" font-size="14" fill="#56605c">ÖTV kademeli değil; eşik aşılınca üst oran matrahın tamamına uygulanır</text><line x1="192" y1="84" x2="192" y2="278" stroke="#e2ddd2" stroke-width="1"/><text x="192" y="76" text-anchor="middle" font-size="12" fill="#56605c">0</text><line x1="283.5" y1="84" x2="283.5" y2="278" stroke="#e2ddd2" stroke-width="1"/><text x="283.5" y="76" text-anchor="middle" font-size="12" fill="#56605c">1 mn</text><line x1="375" y1="84" x2="375" y2="278" stroke="#e2ddd2" stroke-width="1"/><text x="375" y="76" text-anchor="middle" font-size="12" fill="#56605c">2 mn</text><line x1="466.5" y1="84" x2="466.5" y2="278" stroke="#e2ddd2" stroke-width="1"/><text x="466.5" y="76" text-anchor="middle" font-size="12" fill="#56605c">3 mn</text><line x1="558" y1="84" x2="558" y2="278" stroke="#e2ddd2" stroke-width="1"/><text x="558" y="76" text-anchor="middle" font-size="12" fill="#56605c">4 mn</text><line x1="192" y1="109" x2="558" y2="109" stroke="#17201d" stroke-width="1.5" stroke-opacity="0.30"/><rect x="418.4625" y="96" width="54.351" height="26" fill="#0e7c66"/><text x="180" y="114" text-anchor="end" font-size="13" font-weight="700" fill="#17201d">Elektrikli, ≤160 kW</text><line x1="192" y1="159" x2="558" y2="159" stroke="#17201d" stroke-width="1.5" stroke-opacity="0.30"/><rect x="406.9335" y="146" width="44.468999999999994" height="26" fill="#1baf7a"/><text