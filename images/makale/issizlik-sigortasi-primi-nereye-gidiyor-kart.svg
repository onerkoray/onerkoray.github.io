<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Sabit 2026 kurallarıyla 36 ayda toplam fon primi ve koşullu azami işsizlik ödeneği"><style>text{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif}</style><rect width="800" height="500" fill="#f7f5f0"/><rect width="8" height="500" fill="#0e7c66"/><svg x="34" y="30" width="732" height="440" viewBox="0 0 600 360"><text x="28" y="34" font-size="20" font-weight="700" fill="#17201d">Prim, kişisel birikim hesabı değil</text><text x="28" y="57" font-size="13" fill="#56605c">60.000 TL brüt · 36 ay · sabit 2026 kuralları</text><text x="28" y="99" font-size="14" fill="#17201d">Fona giren primler</text><rect x="28.0" y="111" width="45.3" height="48" fill="#2a78d6"/><rect x="73.3" y="111" width="90.7" height="48" fill="#eb6834"/><rect x="164.0" y="111" width="22.7" height="48" fill="#1baf7a"/><text x="196.7" y="142" font-size="16" font-weight="700" fill="#17201d">75.600 TL</text><text x="28" y="205" font-size="14" fill="#17201d">Hak kazanılırsa en çok 10 aylık net ödenek</text><rect x="28" y="217" width="500" height="48" fill="#0e7c66"/><text x="516" y="248" font-size="17" font-weight="700" text-anchor="end" fill="white">238.178 TL</text><rect x="28" y="295" width="10" height="10" fill="#2a78d6"/><text x="44" y="305" font-size="12" fill="#17201d">İşçi %1 · 21.600 TL</text><rect x="215" y="295" width="10" height="10" fill="#eb6834"/><text x="231" y="305" font-size="12" fill="#17201d">İşveren %2 · 43.200 TL</text><rect x="402" y="295" width="10" height="10" fill="#1baf7a"/><text x="418" y="305" font-size="12" fill="#17201d">Devlet %0,5 · 10.800 TL</text><text x="28" y="340" font-size="12" fill="#56605c">Ödenek otomatik değil; prim toplamından mahsup edilmez.</text></svg></svg>
