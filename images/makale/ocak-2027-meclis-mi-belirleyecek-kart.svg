<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Ocak 2027'de maaşa ve vergiye dokunan 11 kalemin 7'si Meclis oyuna bağlı değil, 4'ü bağlı"><style>text{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif}</style><rect width="800" height="500" fill="#f7f5f0"/><rect width="8" height="500" fill="#0e7c66"/><svg x="34" y="30" width="732" height="440" viewBox="0 0 600 360"><text x="24" y="34" font-size="16" font-weight="700" fill="#17201d">Ocak 2027'yi belirleyen 11 kalemin kararı kimde?</text><text x="24" y="56" font-size="13" fill="#56605c">Maaşa, aylığa ve vergiye dokunan kalemler · yürürlükteki kanunlara göre</text><text x="24" y="96" font-size="13" font-weight="700" fill="#17201d">Meclis oyu gerekmez · 7</text><path d="M24 106 h260" stroke="#e2ddd2" stroke-width="1"/><rect x="24" y="119" width="12" height="12" rx="2" fill="#2a78d6"/><text x="44" y="130" font-size="13" fill="#17201d">Gelir vergisi dilimleri</text><rect x="24" y="148" width="12" height="12" rx="2" fill="#2a78d6"/><text x="44" y="159" font-size="13" fill="#17201d">Motorlu taşıtlar vergisi</text><rect x="24" y="177" width="12" height="12" rx="2" fill="#2a78d6"/><text x="44" y="188" font-size="13" fill="#17201d">Harç ve damga tutarları</text><rect x="24" y="206" width="12" height="12" rx="2" fill="#2a78d6"/><text x="44" y="217" font-size="13" fill="#17201d">Asgari ücret</text><rect x="24" y="235" width="12" height="12" rx="2" fill="#2a78d6"/><text x="44" y="246" font-size="13" fill="#17201d">SGK prim tabanı ve tavanı</text><rect x="24" y="264" width="12" height="12" rx="2" fill="#2a78d6"/><text x="44" y="275" font-size="13" fill="#17201d">SSK ve Bağ-Kur zammı</text><rect x="24" y="293" width="12" height="12" rx="2" fill="#2a78d6"/><text x="44" y="304" font-size="13" fill="#17201d">Memur zammı</text><text x="316" y="96" font-size="13" font-weight="700" fill="#17201d">Meclis oyu gerekir · 4</text><path d="M316 106 h260" stroke="#e2ddd2" stroke-width="1"/><rect x="316" y="119" width="12" height="12" rx="2" fill="#eb6834"/><text x="336" y="130" font-size="13" fill="#17201d">2027 bütçesi</text><rect x="316" y="148" width="12" height="12" rx="2" fill="#eb6834"/><text x="336" y="159" font-size="13" fill="#17201d">En düşük emekli aylığı</text><rect x="316" y="177" width="12" height="12" rx="2" fill="#eb6834"/><text x="336" y="188" font-size="13" fill="#17201d">İstisna düzenlemesi</text><rect x="316" y="206" width="12" height="12" rx="2" fill="#eb6834"/><text x="336" y="217" font-size="13" fill="#17201d">Kademeli emeklilik</text><text x="316" y="268" font-size="12" fill="#56605c">Bütçe dışındaki üçünün</text><text x="316" y="285" font-size="12" fill="#56605c">sunulmuş bir teklifi ya da takvimi yok.</text></svg></svg>
